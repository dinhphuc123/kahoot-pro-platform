<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kahoot! Pro — Đấu Trường Trắc Nghiệm Đa Phương Tiện & Toán Học</title>
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX CSS for crisp math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <!-- Google Fonts: Plus Jakarta Sans / Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .kahoot-shadow {
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
    }
    .kahoot-shadow:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-router-dom": "https://esm.sh/react-router-dom@6.28.0?deps=react@18.3.1,react-dom@18.3.1",
        "lucide-react": "https://esm.sh/lucide-react@0.468.0?deps=react@18.3.1",
        "qrcode.react": "https://esm.sh/qrcode.react@4.2.0?deps=react@18.3.1",
        "socket.io-client": "https://esm.sh/socket.io-client@4.8.1",
        "katex": "https://esm.sh/katex@0.16.11",
        "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.3"
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-950 text-white antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
